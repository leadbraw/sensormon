# Postgres in the cluster. Three objects:
#   - PVC: durable storage so data survives pod restarts
#   - Deployment: runs the postgres container, mounts the PVC
#   - Service: stable in-cluster DNS name ("postgres") for the worker to connect to
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: sensormon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # k3s ships "local-path" as the default StorageClass — omit storageClassName
  # to use it, which provisions a directory on the node automatically.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sensormon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: sensormon-secret   # supplies POSTGRES_DB/USER/PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata             # subPath avoids the "lost+found" init issue
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sensormon"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sensormon
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  # ClusterIP (default): only reachable inside the cluster. The worker uses the
  # DNS name "postgres.sensormon.svc.cluster.local" (or just "postgres" same-ns).
