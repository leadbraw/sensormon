# The worker Deployment. Pulls its image from GHCR (set by your CI pipeline),
# and its config from the ConfigMap + Secret created earlier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sensormon
spec:
  replicas: 1     # a poller should generally be ONE replica — two would double-write.
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret # created on cluster
      containers:
        - name: worker
          image: ghcr.io/leadbraw/sensormon-worker:latest
          envFrom:
            - configMapRef:
                name: sensormon-config
            - secretRef:
                name: sensormon-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
# no probes since the worker will just crashloop and also doesnt do any processing or sending or handling of network requests
