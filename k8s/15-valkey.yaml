# Valkey (the BSD-licensed Redis fork) — the message broker for high-temp alerts.
# Three objects, same shape as Postgres:
#   - PVC: durable storage so the alert stream + pending list survive a pod restart
#   - Deployment: runs valkey-server with AOF persistence enabled
#   - Service: stable in-cluster DNS name ("valkey") for producer + consumer
#
# We use Streams (not Pub/Sub): a consumer group gives at-least-once delivery, so an
# Alerter that's down during a deploy doesn't lose alerts — they wait in the stream.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-pvc
  namespace: sensormon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # k3s default "local-path" StorageClass — omit storageClassName to use it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: sensormon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8
          # --appendonly yes turns on AOF so writes are persisted to /data (the PVC).
          # Without this a Valkey restart would drop un-acked alerts sitting in the PEL.
          command: ["valkey-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: valkey-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: sensormon
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
  # ClusterIP (default): the worker and alerter reach it at "valkey:6379" in-namespace.
