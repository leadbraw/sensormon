# ConfigMap = non-secret, Secret = well, secret.
# plaintext pws bad! (duh) this is just for learning
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sensormon-config
  namespace: sensormon
data:
  Sensor__Endpoint: "http://192.168.4.54:8085/data.json" # LHWM's endpoint on my desktop
  Sensor__PollSeconds: "5"
  Sensor__HighTempThreshold: "85.0"
  # Broker + alerting (shared by worker and alerter; both envFrom this ConfigMap).
  Valkey__Connection: "valkey:6379"
  Ntfy__BaseUrl: "https://ntfy.sh"
  Alert__CooldownSeconds: "300"   # per-sensor debounce/idempotency window (5 min)
  TZ: "America/Los_Angeles"
---
apiVersion: v1
kind: Secret
metadata:
  name: sensormon-secret
  namespace: sensormon
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sensormon;Username=sensormon;Password=changeme-in-real-life"
  # read on first init
  POSTGRES_DB: "sensormon"
  POSTGRES_USER: "sensormon"
  POSTGRES_PASSWORD: "changeme-in-real-life"
  # semi-secret
  Ntfy__Topic: "sensormon12"
