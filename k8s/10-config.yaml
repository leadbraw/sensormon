# ConfigMap = non-secret config. Secret = sensitive values.
# Splitting them teaches the distinction interviewers ask about.
#
# NOTE: this Secret uses stringData with a plaintext password for LEARNING ONLY.
# In the real world you'd use sealed-secrets / external-secrets / SOPS so you
# never commit plaintext. Worth saying out loud: "I know committing this is bad;
# for a real cluster I'd use sealed-secrets or External Secrets Operator."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sensormon-config
  namespace: sensormon
data:
  # Your desktop's reserved LAN IP + LHM port. The pod reaches this over the LAN.
  Sensor__Endpoint: "http://192.168.4.54:8085/data.json"
  Sensor__PollSeconds: "5"
  Sensor__HighTempThreshold: "85.0"
  # The worker stores DateTime.Now (local wall-clock). Containers default to UTC,
  # so we pin the zone here. IANA name (not a fixed offset) so DST is automatic:
  # PDT (UTC-7) in summer, PST (UTC-8) in winter. tzdata is already in the image.
  TZ: "America/Los_Angeles"
  # NOTE: Sensor__Components (the per-component sensor allow-list) is NOT set here.
  # It's complex nested config, so it ships baked into the image via appsettings.json.
  # .NET loads appsettings.json first, then these env vars override the scalar keys
  # above — so the component filter comes from the image and the endpoint from here.
---
apiVersion: v1
kind: Secret
metadata:
  name: sensormon-secret
  namespace: sensormon
type: Opaque
stringData:
  # The worker reads ConnectionStrings__Postgres from env (see deployment).
  # "postgres" here is the in-cluster DNS name of the Postgres Service.
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sensormon;Username=sensormon;Password=changeme-in-real-life"
  # Postgres itself reads these on first init.
  POSTGRES_DB: "sensormon"
  POSTGRES_USER: "sensormon"
  POSTGRES_PASSWORD: "changeme-in-real-life"
