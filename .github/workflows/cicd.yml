name: build-and-push

# Phase 3 pipeline (pull-based GitOps):
# On push to main, build the worker image and push it to GHCR tagged by commit SHA,
# then write that tag into k8s/kustomization.yaml and commit it back. Argo CD (running
# IN the cluster) watches the repo and reconciles the Deployment to the new tag.
# There is no deploy step here — the cluster pulls. Nothing reaches into the LAN.
on:
  push:
    branches: [main]
    # Skip rebuilds for changes that don't affect the image: the manifests Argo
    # watches, and docs. This also means the commit-back below never rebuilds.
    paths-ignore:
      - 'k8s/**'
      - '**.md'
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/leadbraw/sensormon-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # to commit the new image tag back to the repo
      packages: write       # to push the image to GHCR with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitOps write-back: point the desired image tag in git at the image we just
      # pushed. Argo CD reconciles the cluster to match. Pushes made with GITHUB_TOKEN
      # do NOT trigger another workflow run (GitHub's recursion guard), and the
      # paths-ignore above covers k8s/** too — so this never loops.
      - name: Update image tag in kustomization and commit back
        run: |
          set -euo pipefail
          TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "Setting k8s/kustomization.yaml image tag to ${TAG}"
          yq -i ".images[0].newTag = \"${TAG}\"" k8s/kustomization.yaml
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "Image tag already up to date; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: deploy ${IMAGE}:${TAG}"
          git push
