name: build-and-push

# Phase 3+4 pipeline (pull-based GitOps):
# On push to main, build BOTH service images (worker + alerter) and push them to GHCR
# tagged by commit SHA, then write those tags into k8s/kustomization.yaml and commit it
# back. Argo CD (running IN the cluster) watches the repo and reconciles the Deployments
# to the new tags. There is no deploy step here — the cluster pulls. Nothing reaches the LAN.
on:
  push:
    branches: [main]
    # Skip rebuilds for changes that don't affect the images: the manifests Argo
    # watches, and docs. This also means the commit-back below never rebuilds.
    paths-ignore:
      - 'k8s/**'
      - '**.md'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/leadbraw/sensormon

jobs:
  # Build each service in parallel from the one parameterized Dockerfile.
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write       # to push the image to GHCR with GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - name: worker
            project: SensorMon.Worker
          - name: alerter
            project: SensorMon.Alerter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            PROJECT=${{ matrix.project }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope the cache per image so the two matrix legs don't clobber each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # GitOps write-back: runs ONCE after both images are pushed (avoids two matrix legs
  # racing on git push). Points both desired image tags in git at this commit's images;
  # Argo CD reconciles the cluster to match. Pushes made with GITHUB_TOKEN do NOT trigger
  # another workflow run (GitHub's recursion guard), and paths-ignore covers k8s/** too —
  # so this never loops.
  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # to commit the new image tags back to the repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update image tags in kustomization and commit back
        run: |
          set -euo pipefail
          TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "Setting both image tags to ${TAG}"
          # Select by image name (not index) so manifest ordering can't break this.
          yq -i "(.images[] | select(.name == \"${IMAGE_PREFIX}-worker\")).newTag  = \"${TAG}\"" k8s/kustomization.yaml
          yq -i "(.images[] | select(.name == \"${IMAGE_PREFIX}-alerter\")).newTag = \"${TAG}\"" k8s/kustomization.yaml
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "Image tags already up to date; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: deploy ${IMAGE_PREFIX}-{worker,alerter}:${TAG}"
          git push
